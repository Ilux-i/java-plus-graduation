eureka:
  client:
    fetchRegistry: true
    registryFetchIntervalSeconds: 5
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: gateway-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      discovery:
        enabled: true
        serviceId: CONFIG-SERVER
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 6000


    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # Специфичные
        - id: comments_user_route
          uri: lb://COMMENTS
          predicates:
            - Path=/users/{userId}/events/{eventId}/comments/**

        - id: request-management_route
          uri: lb://REQUEST-MANAGEMENT
          predicates:
            - Path=/users/{userId}/requests/**

        - id: user-events_route
          uri: lb://EVENT-MANAGEMENT
          predicates:
            - Path=/users/{userId}/events/**

        # Администраторские пути
        - id: event-management_admin_route
          uri: lb://EVENT-MANAGEMENT
          predicates:
            - Path=/admin/events/**, /admin/categories/**, /admin/compilations/**

        - id: comments_admin_route
          uri: lb://COMMENTS
          predicates:
            - Path=/admin/comments/**

        - id: user-service_route
          uri: lb://USER-ADMINISTRATION
          predicates:
            - Path=/admin/users/**

        # Публичные пути
        - id: event-management_public_route
          uri: lb://EVENT-MANAGEMENT
          predicates:
            - Path=/events/**, /categories/**, /compilations/**

        - id: comments_public_route
          uri: lb://COMMENTS
          predicates:
            - Path=/public/events/{eventId}/comments/**

management:
  endpoints:
    web:
      exposure:
        include: health, gateway, info
      base-path: /actuator
  endpoint:
    gateway:
      enabled: true

server:
  port: 8080

