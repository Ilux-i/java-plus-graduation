eureka:
  client:
    fetchRegistry: true
    registryFetchIntervalSeconds: 5
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

spring:
  application:
    name: gateway-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      discovery:
        enabled: true
        serviceId: CONFIG-SERVER
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 6000


    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # main-service
        - id: main_service_route
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/admin/**, /users/**, /public/**, /compilations/**, /events/**, /categories/**
        # stats-server
        - id: stats_server_route
          uri: lb://STATS-SERVER
          predicates:
            - Path=/hit, /stats/**

management:
  endpoints:
    web:
      exposure:
        include: health, gateway, info
      base-path: /actuator
  endpoint:
    gateway:
      enabled: true

server:
  port: 8080

