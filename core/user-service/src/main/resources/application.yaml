eureka:
  client:
    fetchRegistry: true
    registryFetchIntervalSeconds: 5
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 0

spring:
  application:
    name: user-service

  config:
    import: "optional:configserver:"

  cloud:
    config:
      discovery:
        enabled: true
        serviceId: CONFIG-SERVER
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1000
        multiplier: 1.1
        max-interval: 6000